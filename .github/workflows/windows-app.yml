name: Windows App
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'desktop/windows/**'
      - 'scripts/prepare-windows.mjs'
      - '.github/workflows/windows-app.yml'
      - 'index.html'
      - 'splash.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'assets/brand/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm run selftest
      - run: node scripts/prepare-windows.mjs
      - name: Build desktop application
        shell: pwsh
        run: |
          dotnet build desktop/windows/DeutschAssistant.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $license = Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.web.webview2/1.0.4258.31" -Filter '*LICENSE*' -File | Select-Object -First 1
          if (-not $license) { throw 'WebView2 license missing' }
          Copy-Item $license.FullName desktop/windows/bin/Release/net48/WebView2-LICENSE.txt
      - name: Prepare WebView2 Runtime
        shell: pwsh
        run: |
          $app = (Resolve-Path 'desktop/windows/bin/Release/net48/DeutschAssistant.exe').Path
          $check = Start-Process $app '--check-runtime' -PassThru -Wait
          if ($check.ExitCode -ne 0) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/WebView2Setup.exe"
            $setup = Start-Process "$env:RUNNER_TEMP/WebView2Setup.exe" '/silent /install' -PassThru -Wait
            $check = Start-Process $app '--check-runtime' -PassThru -Wait
            if ($check.ExitCode -ne 0) { throw 'WebView2 Runtime is unavailable' }
          }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup is unavailable' }
          & $compiler desktop/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Compress-Archive -Path desktop/windows/bin/Release/net48/* -DestinationPath dist/Deutsch-Assistant-Windows-Portable.zip
      - name: Install and verify the actual Windows application
        shell: pwsh
        run: |
          $installed = "$env:RUNNER_TEMP/DeutschAssistant-Installed"
          $qa = "$env:RUNNER_TEMP/windows-qa"
          New-Item -ItemType Directory -Force $qa | Out-Null
          $installer = (Resolve-Path 'dist/Deutsch-Assistant-Windows-Setup.exe').Path
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installed") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = "$installed/DeutschAssistant.exe"
          foreach ($mode in @('first','reopen')) {
            $arguments = @("--self-test=$qa")
            if ($mode -eq 'reopen') { $arguments += '--verify-persistence' }
            $process = Start-Process $exe -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Windows smoke test timeout' }
            if ($process.ExitCode -ne 0) { Get-Content "$qa/failure.txt"; throw 'Windows smoke test failed' }
          }
          $uninstall = Start-Process "$installed/unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (-not (Test-Path "$qa/profile")) { throw 'Uninstall removed profile data' }
          Copy-Item -Recurse $qa windows-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-qa
          path: |
            windows-qa/*.json
            windows-qa/*.png
            ${{ runner.temp }}/windows-qa/failure.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: deutsch-assistant-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
